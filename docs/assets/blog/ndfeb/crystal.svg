<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <title>Tetragonal Nd2Fe14B Crystal Structure and Easy Axis</title>
  <style>
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
    }
    .unit-cell {
      fill: none;
      stroke: #7c8a9a;
      stroke-width: 2.5;
      stroke-dasharray: 8 6;
      stroke-opacity: 0.65;
    }
    .fe-bond {
      fill: none;
      stroke: #7c8a9a;
      stroke-width: 2;
      stroke-opacity: 0.55;
    }
    .nd-b-bond {
      fill: none;
      stroke: #d97757;
      stroke-width: 2;
      stroke-opacity: 0.45;
    }
    .atom-nd {
      fill: #d97757;
      stroke: #c15f3c;
      stroke-width: 2.5;
      fill-opacity: 0.9;
    }
    .atom-fe {
      fill: #7c8a9a;
      stroke: #7c8a9a;
      stroke-width: 2;
      fill-opacity: 0.9;
    }
    .atom-b {
      fill: #c9a227;
      stroke: #c9a227;
      stroke-width: 2;
    }
    .vib-1 {
      animation: vib-1 6s ease-in-out infinite;
    }
    .vib-2 {
      animation: vib-2 7s ease-in-out infinite;
    }
    .vib-3 {
      animation: vib-3 6.5s ease-in-out infinite;
    }
    .vib-4 {
      animation: vib-4 7.5s ease-in-out infinite;
    }
    @keyframes vib-1 {
      0%, 100% { transform: translate(0, 0); }
      33% { transform: translate(1.2px, -0.9px); }
      66% { transform: translate(-1.0px, 0.8px); }
    }
    @keyframes vib-2 {
      0%, 100% { transform: translate(0, 0); }
      33% { transform: translate(-1.1px, 1.1px); }
      66% { transform: translate(1.0px, -1.0px); }
    }
    @keyframes vib-3 {
      0%, 100% { transform: translate(0, 0); }
      33% { transform: translate(0.9px, 1.2px); }
      66% { transform: translate(-1.2px, -0.7px); }
    }
    @keyframes vib-4 {
      0%, 100% { transform: translate(0, 0); }
      33% { transform: translate(-0.8px, -1.2px); }
      66% { transform: translate(1.1px, 0.9px); }
    }
    .axis-arrow {
      stroke: #d97757;
      stroke-width: 3.5;
      stroke-linecap: round;
    }
    .axis-head {
      fill: #d97757;
    }
    .label {
      font-family: system-ui, sans-serif;
      font-size: 17px;
      font-weight: 600;
      fill: #7c8a9a;
    }
  </style>

  <!-- Easy axis (c) vector along left side -->
  <g>
    <text x="95" y="32" text-anchor="middle" class="label">easy axis (c)</text>
    <line x1="95" y1="325" x2="95" y2="58" class="axis-arrow" />
    <polygon points="95,44 87,62 103,62" class="axis-head" />
  </g>

  <!-- Tetragonal Unit Cell Outline -->
  <rect x="185" y="35" width="270" height="290" rx="3" class="unit-cell" />

  <!-- Bonds in Puckered Fe Nets (Upper Block) -->
  <g class="fe-bond">
    <!-- Layer 1 (y~75) to Layer 2 (y~115) -->
    <line x1="205" y1="72" x2="235" y2="118" />
    <line x1="265" y1="78" x2="235" y2="118" />
    <line x1="265" y1="78" x2="300" y2="112" />
    <line x1="325" y1="72" x2="300" y2="112" />
    <line x1="325" y1="72" x2="360" y2="118" />
    <line x1="390" y1="78" x2="360" y2="118" />
    <line x1="390" y1="78" x2="425" y2="112" />
    <line x1="445" y1="72" x2="425" y2="112" />

    <!-- Layer 2 (y~115) to Layer 3 (y~145) -->
    <line x1="235" y1="118" x2="215" y2="148" />
    <line x1="235" y1="118" x2="275" y2="142" />
    <line x1="300" y1="112" x2="275" y2="142" />
    <line x1="300" y1="112" x2="335" y2="148" />
    <line x1="360" y1="118" x2="335" y2="148" />
    <line x1="360" y1="118" x2="395" y2="142" />
    <line x1="425" y1="112" x2="395" y2="142" />
    <line x1="425" y1="112" x2="440" y2="148" />
  </g>

  <!-- Bonds in Puckered Fe Nets (Lower Block) -->
  <g class="fe-bond">
    <!-- Layer 4 (y~215) to Layer 5 (y~245) -->
    <line x1="215" y1="212" x2="235" y2="248" />
    <line x1="275" y1="218" x2="235" y2="248" />
    <line x1="275" y1="218" x2="300" y2="242" />
    <line x1="335" y1="212" x2="300" y2="242" />
    <line x1="335" y1="212" x2="360" y2="248" />
    <line x1="395" y1="218" x2="360" y2="248" />
    <line x1="395" y1="218" x2="425" y2="242" />
    <line x1="440" y1="212" x2="425" y2="242" />

    <!-- Layer 5 (y~245) to Layer 6 (y~285) -->
    <line x1="235" y1="248" x2="205" y2="288" />
    <line x1="235" y1="248" x2="265" y2="282" />
    <line x1="300" y1="242" x2="265" y2="282" />
    <line x1="300" y1="242" x2="325" y2="288" />
    <line x1="360" y1="248" x2="325" y2="288" />
    <line x1="360" y1="248" x2="390" y2="282" />
    <line x1="425" y1="242" x2="390" y2="282" />
    <line x1="425" y1="242" x2="445" y2="288" />
  </g>

  <!-- Nd-B Plane in-plane links -->
  <g class="nd-b-bond">
    <line x1="205" y1="35" x2="435" y2="35" />
    <line x1="205" y1="180" x2="435" y2="180" />
    <line x1="205" y1="325" x2="435" y2="325" />
  </g>

  <!-- Puckered Fe Net Atoms (Steel) -->
  <g>
    <!-- Upper Block: Layer 1 -->
    <circle cx="205" cy="72" r="7.5" class="atom-fe vib-1" />
    <circle cx="265" cy="78" r="7.5" class="atom-fe vib-2" />
    <circle cx="325" cy="72" r="7.5" class="atom-fe vib-3" />
    <circle cx="390" cy="78" r="7.5" class="atom-fe vib-4" />
    <circle cx="445" cy="72" r="7.5" class="atom-fe vib-1" />

    <!-- Upper Block: Layer 2 -->
    <circle cx="235" cy="118" r="7.5" class="atom-fe vib-2" />
    <circle cx="300" cy="112" r="7.5" class="atom-fe vib-3" />
    <circle cx="360" cy="118" r="7.5" class="atom-fe vib-4" />
    <circle cx="425" cy="112" r="7.5" class="atom-fe vib-1" />

    <!-- Upper Block: Layer 3 -->
    <circle cx="215" cy="148" r="7.5" class="atom-fe vib-3" />
    <circle cx="275" cy="142" r="7.5" class="atom-fe vib-4" />
    <circle cx="335" cy="148" r="7.5" class="atom-fe vib-1" />
    <circle cx="395" cy="142" r="7.5" class="atom-fe vib-2" />
    <circle cx="440" cy="148" r="7.5" class="atom-fe vib-3" />

    <!-- Lower Block: Layer 4 -->
    <circle cx="215" cy="212" r="7.5" class="atom-fe vib-4" />
    <circle cx="275" cy="218" r="7.5" class="atom-fe vib-1" />
    <circle cx="335" cy="212" r="7.5" class="atom-fe vib-2" />
    <circle cx="395" cy="218" r="7.5" class="atom-fe vib-3" />
    <circle cx="440" cy="212" r="7.5" class="atom-fe vib-4" />

    <!-- Lower Block: Layer 5 -->
    <circle cx="235" cy="248" r="7.5" class="atom-fe vib-1" />
    <circle cx="300" cy="242" r="7.5" class="atom-fe vib-2" />
    <circle cx="360" cy="248" r="7.5" class="atom-fe vib-3" />
    <circle cx="425" cy="242" r="7.5" class="atom-fe vib-4" />

    <!-- Lower Block: Layer 6 -->
    <circle cx="205" cy="288" r="7.5" class="atom-fe vib-2" />
    <circle cx="265" cy="282" r="7.5" class="atom-fe vib-3" />
    <circle cx="325" cy="288" r="7.5" class="atom-fe vib-4" />
    <circle cx="390" cy="282" r="7.5" class="atom-fe vib-1" />
    <circle cx="445" cy="288" r="7.5" class="atom-fe vib-2" />
  </g>

  <!-- Nd and B Atoms (Nd-B Planes at z=0, z=0.5, z=1.0) -->
  <g>
    <!-- Top Plane (y=35) -->
    <circle cx="210" cy="35" r="11" class="atom-nd vib-1" />
    <circle cx="270" cy="35" r="6" class="atom-b vib-3" />
    <circle cx="320" cy="35" r="11" class="atom-nd vib-2" />
    <circle cx="370" cy="35" r="6" class="atom-b vib-4" />
    <circle cx="430" cy="35" r="11" class="atom-nd vib-3" />

    <!-- Middle Plane (y=180) -->
    <circle cx="210" cy="180" r="11" class="atom-nd vib-3" />
    <circle cx="270" cy="180" r="6" class="atom-b vib-1" />
    <circle cx="320" cy="180" r="11" class="atom-nd vib-4" />
    <circle cx="370" cy="180" r="6" class="atom-b vib-2" />
    <circle cx="430" cy="180" r="11" class="atom-nd vib-1" />

    <!-- Bottom Plane (y=325) -->
    <circle cx="210" cy="325" r="11" class="atom-nd vib-2" />
    <circle cx="270" cy="325" r="6" class="atom-b vib-4" />
    <circle cx="320" cy="325" r="11" class="atom-nd vib-1" />
    <circle cx="370" cy="325" r="6" class="atom-b vib-3" />
    <circle cx="430" cy="325" r="11" class="atom-nd vib-2" />
  </g>

  <!-- Legend on Right Side -->
  <g>
    <!-- Nd -->
    <circle cx="518" cy="105" r="11" class="atom-nd" />
    <text x="548" y="111" class="label">Nd</text>

    <!-- Fe -->
    <circle cx="518" cy="178" r="7.5" class="atom-fe" />
    <text x="548" y="184" class="label">Fe</text>

    <!-- B -->
    <circle cx="518" cy="250" r="6" class="atom-b" />
    <text x="548" y="256" class="label">B</text>
  </g>
</svg>
