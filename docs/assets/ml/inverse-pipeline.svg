<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" width="100%" height="100%">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#7c8a9a" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#8fae7e" />
    </marker>
    <marker id="arrow-gold" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#c9a227" />
    </marker>
  </defs>

  <style>
    .label-main {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 16px;
      font-weight: 600;
      fill: #7c8a9a;
    }
    .label-sub {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 13px;
      font-weight: 500;
      fill: #7c8a9a;
    }
    .label-badge {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 12px;
      font-weight: 600;
    }
    .flow-line {
      stroke: #7c8a9a;
      stroke-width: 2;
      stroke-dasharray: 4 4;
    }

    @keyframes twinkle {
      0%, 100% { opacity: 0.35; }
      50% { opacity: 1; }
    }
    @keyframes dropDown {
      0% { transform: translateY(0px); opacity: 0.9; }
      70% { transform: translateY(35px); opacity: 0.8; }
      100% { transform: translateY(55px); opacity: 0; }
    }
    @keyframes passThrough {
      0% { transform: translateX(0px); opacity: 0; }
      30% { opacity: 1; }
      70% { opacity: 1; }
      100% { transform: translateX(50px); opacity: 0; }
    }
    @keyframes pulseCard {
      0%, 100% { opacity: 0.9; }
      50% { opacity: 1; }
    }
    @keyframes rankPulse {
      0%, 100% { transform: scaleX(0.96); }
      50% { transform: scaleX(1); }
    }

    .dot-twinkle-1 { animation: twinkle 2.4s ease-in-out infinite; }
    .dot-twinkle-2 { animation: twinkle 2.4s ease-in-out infinite 0.8s; }
    .dot-twinkle-3 { animation: twinkle 2.4s ease-in-out infinite 1.6s; }
    .dot-drop-1 { animation: dropDown 2.2s cubic-bezier(0.5, 0, 0.8, 0.8) infinite; }
    .dot-drop-2 { animation: dropDown 2.2s cubic-bezier(0.5, 0, 0.8, 0.8) infinite 0.7s; }
    .pass-dot { animation: passThrough 2.0s cubic-bezier(0.4, 0, 0.2, 1) infinite; }
    .card-glow { animation: pulseCard 3s ease-in-out infinite; }
    .bar-rank { transform-origin: left center; animation: rankPulse 2s ease-in-out infinite; }

    @media (prefers-reduced-motion: reduce) {
      .dot-twinkle-1, .dot-twinkle-2, .dot-twinkle-3, .dot-drop-1, .dot-drop-2, .pass-dot, .card-glow, .bar-rank {
        animation: none !important;
      }
    }
  </style>

  <!-- Top Title -->
  <text x="480" y="36" text-anchor="middle" class="label-main" letter-spacing="0.06em">INVERSE DESIGN SCREENING PIPELINE ACROSS 672 CANDIDATES</text>

  <!-- Stage 1: 672 Candidates Grid of Dots -->
  <g id="box-candidates">
    <rect x="20" y="60" width="155" height="215" rx="8" fill="rgba(91, 143, 185, 0.08)" stroke="#5b8fb9" stroke-width="1.5" class="card-glow" />
    <rect x="20" y="60" width="155" height="30" rx="8" fill="rgba(91, 143, 185, 0.18)" />
    <text x="97" y="81" text-anchor="middle" class="label-main" fill="#5b8fb9">672 Candidates</text>
    <text x="97" y="106" text-anchor="middle" class="label-badge" fill="#7c8a9a">10 Refractory Metals</text>

    <!-- Grid of Dots representing candidate pool -->
    <g transform="translate(35, 118)">
      <circle cx="0" cy="0" r="3.5" fill="#5b8fb9" class="dot-twinkle-1" />
      <circle cx="21" cy="0" r="3.5" fill="#7c8a9a" class="dot-twinkle-2" />
      <circle cx="42" cy="0" r="3.5" fill="#5b8fb9" class="dot-twinkle-3" />
      <circle cx="63" cy="0" r="3.5" fill="#7c8a9a" class="dot-twinkle-1" />
      <circle cx="84" cy="0" r="3.5" fill="#5b8fb9" class="dot-twinkle-2" />
      <circle cx="105" cy="0" r="3.5" fill="#7c8a9a" class="dot-twinkle-3" />

      <circle cx="0" cy="18" r="3.5" fill="#7c8a9a" class="dot-twinkle-2" />
      <circle cx="21" cy="18" r="3.5" fill="#5b8fb9" class="dot-twinkle-3" />
      <circle cx="42" cy="18" r="3.5" fill="#7c8a9a" class="dot-twinkle-1" />
      <circle cx="63" cy="18" r="3.5" fill="#5b8fb9" class="dot-twinkle-2" />
      <circle cx="84" cy="18" r="3.5" fill="#7c8a9a" class="dot-twinkle-3" />
      <circle cx="105" cy="18" r="3.5" fill="#5b8fb9" class="dot-twinkle-1" />

      <circle cx="0" cy="36" r="3.5" fill="#5b8fb9" class="dot-twinkle-3" />
      <circle cx="21" cy="36" r="3.5" fill="#7c8a9a" class="dot-twinkle-1" />
      <circle cx="42" cy="36" r="3.5" fill="#5b8fb9" class="dot-twinkle-2" />
      <circle cx="63" cy="36" r="3.5" fill="#7c8a9a" class="dot-twinkle-3" />
      <circle cx="84" cy="36" r="3.5" fill="#5b8fb9" class="dot-twinkle-1" />
      <circle cx="105" cy="36" r="3.5" fill="#7c8a9a" class="dot-twinkle-2" />

      <circle cx="0" cy="54" r="3.5" fill="#7c8a9a" class="dot-twinkle-1" />
      <circle cx="21" cy="54" r="3.5" fill="#5b8fb9" class="dot-twinkle-2" />
      <circle cx="42" cy="54" r="3.5" fill="#7c8a9a" class="dot-twinkle-3" />
      <circle cx="63" cy="54" r="3.5" fill="#5b8fb9" class="dot-twinkle-1" />
      <circle cx="84" cy="54" r="3.5" fill="#7c8a9a" class="dot-twinkle-2" />
      <circle cx="105" cy="54" r="3.5" fill="#5b8fb9" class="dot-twinkle-3" />

      <circle cx="0" cy="72" r="3.5" fill="#5b8fb9" class="dot-twinkle-2" />
      <circle cx="21" cy="72" r="3.5" fill="#7c8a9a" class="dot-twinkle-3" />
      <circle cx="42" cy="72" r="3.5" fill="#5b8fb9" class="dot-twinkle-1" />
      <circle cx="63" cy="72" r="3.5" fill="#7c8a9a" class="dot-twinkle-2" />
      <circle cx="84" cy="72" r="3.5" fill="#5b8fb9" class="dot-twinkle-3" />
      <circle cx="105" cy="72" r="3.5" fill="#7c8a9a" class="dot-twinkle-1" />

      <circle cx="0" cy="90" r="3.5" fill="#7c8a9a" class="dot-twinkle-3" />
      <circle cx="21" cy="90" r="3.5" fill="#5b8fb9" class="dot-twinkle-1" />
      <circle cx="42" cy="90" r="3.5" fill="#7c8a9a" class="dot-twinkle-2" />
      <circle cx="63" cy="90" r="3.5" fill="#5b8fb9" class="dot-twinkle-3" />
      <circle cx="84" cy="90" r="3.5" fill="#7c8a9a" class="dot-twinkle-1" />
      <circle cx="105" cy="90" r="3.5" fill="#5b8fb9" class="dot-twinkle-2" />
    </g>

    <text x="97" y="255" text-anchor="middle" class="label-sub">4, 5 and 6 Elements</text>
  </g>

  <!-- Flow 1 -->
  <line x1="175" y1="160" x2="215" y2="160" class="flow-line" marker-end="url(#arrow)" />

  <!-- Stage 2: Phase Gate Filter (Dots Drop Out) -->
  <g id="box-phase-gate">
    <rect x="215" y="60" width="165" height="215" rx="8" fill="rgba(143, 174, 126, 0.08)" stroke="#8fae7e" stroke-width="1.5" class="card-glow" />
    <rect x="215" y="60" width="165" height="30" rx="8" fill="rgba(143, 174, 126, 0.18)" />
    <text x="297" y="81" text-anchor="middle" class="label-main" fill="#8fae7e">Phase Gate</text>
    <text x="297" y="106" text-anchor="middle" class="label-badge" fill="#8fae7e">P(BCC) ≥ 0.70 Filter</text>

    <!-- Funnel Filter Barrier -->
    <line x1="285" y1="120" x2="285" y2="195" stroke="#8fae7e" stroke-width="2" stroke-dasharray="3 3" />
    
    <!-- Passing Dots (Sage) flowing through -->
    <circle cx="260" cy="145" r="4" fill="#8fae7e" class="pass-dot" />
    <circle cx="250" cy="170" r="4" fill="#8fae7e" class="pass-dot" style="animation-delay: 0.6s;" />

    <!-- Dropping Dots (Clay) dropping down -->
    <circle cx="275" cy="155" r="4" fill="#d97757" class="dot-drop-1" />
    <circle cx="295" cy="165" r="4" fill="#d97757" class="dot-drop-2" />

    <!-- Dropout Area at Bottom -->
    <rect x="230" y="235" width="135" height="26" rx="4" fill="rgba(217, 119, 87, 0.12)" stroke="#d97757" stroke-width="1" />
    <text x="297" y="252" text-anchor="middle" class="label-badge" fill="#d97757">Drop non-BCC</text>
  </g>

  <!-- Flow 2 (BCC Pass) -->
  <text x="400" y="150" text-anchor="middle" class="label-badge" fill="#8fae7e">BCC Pass</text>
  <line x1="380" y1="160" x2="420" y2="160" class="flow-line" stroke="#8fae7e" marker-end="url(#arrow-green)" />

  <!-- Stage 3: 6-Model Tc -->
  <g id="box-models">
    <rect x="420" y="60" width="165" height="215" rx="8" fill="rgba(91, 143, 185, 0.08)" stroke="#5b8fb9" stroke-width="1.5" class="card-glow" />
    <rect x="420" y="60" width="165" height="30" rx="8" fill="rgba(91, 143, 185, 0.18)" />
    <text x="502" y="81" text-anchor="middle" class="label-main" fill="#5b8fb9">6-Model Tc</text>
    <text x="502" y="106" text-anchor="middle" class="label-badge" fill="#7c8a9a">Ensemble Predictor</text>

    <!-- Mini Model Bars -->
    <g transform="translate(435, 120)">
      <rect x="0" y="0" width="135" height="14" rx="3" fill="rgba(91, 143, 185, 0.15)" />
      <text x="8" y="11" class="label-badge" fill="#5b8fb9">Extra Trees</text>
      <text x="127" y="11" text-anchor="end" class="label-badge" fill="#7c8a9a">0.87</text>

      <rect x="0" y="18" width="135" height="14" rx="3" fill="rgba(91, 143, 185, 0.15)" />
      <text x="8" y="29" class="label-badge" fill="#5b8fb9">Random Forest</text>
      <text x="127" y="29" text-anchor="end" class="label-badge" fill="#7c8a9a">0.87</text>

      <rect x="0" y="36" width="135" height="14" rx="3" fill="rgba(91, 143, 185, 0.15)" />
      <text x="8" y="47" class="label-badge" fill="#5b8fb9">XGBoost</text>
      <text x="127" y="47" text-anchor="end" class="label-badge" fill="#7c8a9a">0.86</text>

      <rect x="0" y="54" width="135" height="14" rx="3" fill="rgba(91, 143, 185, 0.15)" />
      <text x="8" y="65" class="label-badge" fill="#5b8fb9">KNN</text>
      <text x="127" y="65" text-anchor="end" class="label-badge" fill="#7c8a9a">0.83</text>

      <rect x="0" y="72" width="135" height="14" rx="3" fill="rgba(91, 143, 185, 0.15)" />
      <text x="8" y="83" class="label-badge" fill="#5b8fb9">SVR</text>
      <text x="127" y="83" text-anchor="end" class="label-badge" fill="#7c8a9a">0.81</text>

      <rect x="0" y="90" width="135" height="14" rx="3" fill="rgba(91, 143, 185, 0.15)" />
      <text x="8" y="101" class="label-badge" fill="#5b8fb9">Gradient Boost</text>
      <text x="127" y="101" text-anchor="end" class="label-badge" fill="#7c8a9a">0.81</text>
    </g>

    <text x="502" y="255" text-anchor="middle" class="label-sub">Consensus Evaluation</text>
  </g>

  <!-- Flow 3 -->
  <line x1="585" y1="160" x2="625" y2="160" class="flow-line" marker-end="url(#arrow)" />

  <!-- Stage 4: 5-Check Gate -->
  <g id="box-checks">
    <rect x="625" y="60" width="180" height="215" rx="8" fill="rgba(201, 162, 39, 0.08)" stroke="#c9a227" stroke-width="1.5" class="card-glow" />
    <rect x="625" y="60" width="180" height="30" rx="8" fill="rgba(201, 162, 39, 0.18)" />
    <text x="715" y="81" text-anchor="middle" class="label-main" fill="#c9a227">5-Check Gate</text>
    <text x="715" y="106" text-anchor="middle" class="label-badge" fill="#7c8a9a">Verification Filter</text>

    <!-- Checklist with Green Marks -->
    <g transform="translate(638, 120)">
      <path d="M 0 5 L 4 9 L 11 1" stroke="#8fae7e" stroke-width="2" fill="none" />
      <text x="18" y="7" class="label-sub">P(BCC) ≥ threshold</text>

      <path d="M 0 26 L 4 30 L 11 22" stroke="#8fae7e" stroke-width="2" fill="none" />
      <text x="18" y="28" class="label-sub">Spread σ ≤ 2.0 K</text>

      <path d="M 0 47 L 4 51 L 11 43" stroke="#8fae7e" stroke-width="2" fill="none" />
      <text x="18" y="49" class="label-sub">Tc in search range</text>

      <path d="M 0 68 L 4 72 L 11 64" stroke="#8fae7e" stroke-width="2" fill="none" />
      <text x="18" y="70" class="label-sub">VEC 3.5 to 7.5</text>

      <path d="M 0 89 L 4 93 L 11 85" stroke="#8fae7e" stroke-width="2" fill="none" />
      <text x="18" y="91" class="label-sub">Novelty check</text>
    </g>

    <text x="715" y="255" text-anchor="middle" class="label-badge" fill="#c9a227">All 5 Must Pass</text>
  </g>

  <!-- Flow 4 -->
  <text x="825" y="150" text-anchor="middle" class="label-badge" fill="#c9a227">Passed</text>
  <line x1="805" y1="160" x2="845" y2="160" class="flow-line" stroke="#c9a227" marker-end="url(#arrow-gold)" />

  <!-- Stage 5: Top 10 Ranked List -->
  <g id="box-ranking">
    <rect x="845" y="60" width="95" height="215" rx="8" fill="rgba(217, 119, 87, 0.08)" stroke="#d97757" stroke-width="1.5" class="card-glow" />
    <rect x="845" y="60" width="95" height="30" rx="8" fill="rgba(217, 119, 87, 0.18)" />
    <text x="892" y="81" text-anchor="middle" class="label-main" fill="#d97757">Top 10</text>
    <text x="892" y="106" text-anchor="middle" class="label-badge" fill="#d97757">Ranked List</text>

    <!-- Ranked Stacked Bars -->
    <g transform="translate(855, 122)">
      <rect x="0" y="0" width="75" height="15" rx="3" fill="#c9a227" class="bar-rank" />
      <text x="6" y="11" class="label-badge" fill="#1a1917">#1</text>

      <rect x="0" y="19" width="68" height="15" rx="3" fill="#c9a227" opacity="0.85" class="bar-rank" />
      <text x="6" y="30" class="label-badge" fill="#1a1917">#2</text>

      <rect x="0" y="38" width="62" height="15" rx="3" fill="#d97757" class="bar-rank" />
      <text x="6" y="49" class="label-badge" fill="#ffffff">#3</text>

      <rect x="0" y="57" width="55" height="15" rx="3" fill="#7c8a9a" opacity="0.85" />
      <text x="6" y="68" class="label-badge" fill="#ffffff">#4</text>

      <rect x="0" y="76" width="48" height="15" rx="3" fill="#7c8a9a" opacity="0.65" />
      <text x="6" y="87" class="label-badge" fill="#ffffff">#5</text>

      <text x="37" y="105" text-anchor="middle" class="label-badge" fill="#7c8a9a">... to #10</text>
    </g>

    <text x="892" y="255" text-anchor="middle" class="label-sub">Screened hypotheses</text>
  </g>
</svg>