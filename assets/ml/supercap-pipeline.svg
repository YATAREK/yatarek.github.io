<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" width="100%" height="100%">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#7c8a9a" />
    </marker>
    <marker id="arrow-gold" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#c9a227" />
    </marker>
    <marker id="arrow-clay" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#d97757" />
    </marker>
  </defs>

  <style>
    .label-main {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 16px;
      font-weight: 600;
      fill: #7c8a9a;
    }
    .label-sub {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 13px;
      font-weight: 500;
      fill: #7c8a9a;
    }
    .label-badge {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 12px;
      font-weight: 600;
    }
    .flow-line {
      stroke: #7c8a9a;
      stroke-width: 2;
      stroke-dasharray: 4 4;
    }

    @keyframes bandBreathe {
      0%, 100% { fill-opacity: 0.18; }
      50% { fill-opacity: 0.32; }
    }
    @keyframes acqMove {
      0%, 100% { cx: 640px; cy: 133px; }
      50% { cx: 658px; cy: 145px; }
    }
    @keyframes pktFlow1 {
      0% { transform: translateX(0px); opacity: 0; }
      20% { opacity: 1; }
      80% { opacity: 1; }
      100% { transform: translateX(40px); opacity: 0; }
    }
    @keyframes pktFlow2 {
      0% { transform: translateX(0px); opacity: 0; }
      20% { opacity: 1; }
      80% { opacity: 1; }
      100% { transform: translateX(40px); opacity: 0; }
    }
    @keyframes pktFlow3 {
      0% { transform: translateX(0px); opacity: 0; }
      20% { opacity: 1; }
      80% { opacity: 1; }
      100% { transform: translateX(40px); opacity: 0; }
    }
    @keyframes cardPulse {
      0%, 100% { opacity: 0.9; }
      50% { opacity: 1; }
    }

    .uncertainty-band { animation: bandBreathe 3s ease-in-out infinite; }
    .acq-probe { animation: acqMove 2.6s ease-in-out infinite; }
    .pkt-1 { animation: pktFlow1 2.2s cubic-bezier(0.4, 0, 0.2, 1) infinite; }
    .pkt-2 { animation: pktFlow2 2.2s cubic-bezier(0.4, 0, 0.2, 1) infinite 0.7s; }
    .pkt-3 { animation: pktFlow3 2.2s cubic-bezier(0.4, 0, 0.2, 1) infinite 1.4s; }
    .card-glow { animation: cardPulse 3s ease-in-out infinite; }

    @media (prefers-reduced-motion: reduce) {
      .uncertainty-band, .acq-probe, .pkt-1, .pkt-2, .pkt-3, .card-glow {
        animation: none !important;
      }
    }
  </style>

  <!-- Top Title -->
  <text x="480" y="36" text-anchor="middle" class="label-main" letter-spacing="0.06em">PHYSICS-INFORMED GAUSSIAN PROCESS AND BAYESIAN OPTIMISATION PIPELINE</text>

  <!-- Stage 1: Electrode Features (7 physics descriptors) -->
  <g id="box-features">
    <rect x="20" y="60" width="180" height="215" rx="8" fill="rgba(91, 143, 185, 0.08)" stroke="#5b8fb9" stroke-width="1.5" class="card-glow" />
    <rect x="20" y="60" width="180" height="30" rx="8" fill="rgba(91, 143, 185, 0.18)" />
    <text x="110" y="81" text-anchor="middle" class="label-main" fill="#5b8fb9">Electrode Features</text>
    <text x="110" y="104" text-anchor="middle" class="label-badge" fill="#7c8a9a">7 Physics Descriptors</text>

    <g transform="translate(30, 115)">
      <text x="0" y="12" class="label-sub">• Micropore fraction</text>
      <text x="0" y="28" class="label-sub">• Pore density proxy</text>
      <text x="0" y="44" class="label-sub">• SSA-N synergy</text>
      <text x="0" y="60" class="label-sub">• Heteroatom total</text>
      <text x="0" y="76" class="label-sub">• Defect-surface</text>
      <text x="0" y="92" class="label-sub">• Window squared</text>
      <text x="0" y="108" class="label-sub">• Rate penalty</text>
    </g>

    <text x="110" y="255" text-anchor="middle" class="label-badge" fill="#5b8fb9">EDLC Descriptors</text>
  </g>

  <!-- Flow 1 -->
  <line x1="200" y1="160" x2="240" y2="160" class="flow-line" marker-end="url(#arrow)" />
  <circle cx="200" cy="160" r="4.5" fill="#5b8fb9" class="pkt-1" />

  <!-- Stage 2: Gaussian Process (Mean line + shaded uncertainty band) -->
  <g id="box-gp">
    <rect x="240" y="60" width="235" height="215" rx="8" fill="rgba(143, 174, 126, 0.08)" stroke="#8fae7e" stroke-width="1.5" class="card-glow" />
    <rect x="240" y="60" width="235" height="30" rx="8" fill="rgba(143, 174, 126, 0.18)" />
    <text x="357" y="81" text-anchor="middle" class="label-main" fill="#8fae7e">Gaussian Process</text>
    <text x="357" y="104" text-anchor="middle" class="label-badge" fill="#7c8a9a">Gouy-Chapman Prior</text>

    <!-- Mini Coordinate Frame -->
    <g transform="translate(255, 115)">
      <!-- Axes -->
      <line x1="20" y1="95" x2="195" y2="95" stroke="#7c8a9a" stroke-width="1" />
      <line x1="20" y1="10" x2="20" y2="95" stroke="#7c8a9a" stroke-width="1" />
      <text x="195" y="107" text-anchor="end" class="label-badge" fill="#7c8a9a">SSA</text>
      <text x="12" y="16" class="label-badge" fill="#7c8a9a">C</text>

      <!-- Shaded Uncertainty Band -->
      <path d="M 25 80 Q 80 70 120 40 T 190 18 L 190 48 Q 120 70 80 90 T 25 93 Z" fill="#5b8fb9" fill-opacity="0.22" class="uncertainty-band" />

      <!-- Mean Line -->
      <path d="M 25 86 Q 80 75 120 55 T 190 33" fill="none" stroke="#5b8fb9" stroke-width="2.5" />

      <!-- Data Points -->
      <circle cx="35" cy="85" r="3" fill="#8fae7e" />
      <circle cx="65" cy="78" r="3" fill="#7c8a9a" />
      <circle cx="95" cy="68" r="3" fill="#8fae7e" />
      <circle cx="125" cy="52" r="3" fill="#7c8a9a" />
      <circle cx="155" cy="45" r="3" fill="#8fae7e" />
      <circle cx="180" cy="36" r="3" fill="#7c8a9a" />
    </g>

    <text x="357" y="240" text-anchor="middle" class="label-badge" fill="#8fae7e">Calibrated Uncertainty</text>
    <text x="357" y="258" text-anchor="middle" class="label-sub">R² = 0.50, RMSE 73 F/g</text>
  </g>

  <!-- Flow 2 -->
  <line x1="475" y1="160" x2="515" y2="160" class="flow-line" marker-end="url(#arrow)" />
  <circle cx="475" cy="160" r="4.5" fill="#8fae7e" class="pkt-2" />

  <!-- Stage 3: Bayesian Optimisation Loop (Acquisition curve + moving point) -->
  <g id="box-bo">
    <rect x="515" y="60" width="245" height="215" rx="8" fill="rgba(201, 162, 39, 0.08)" stroke="#c9a227" stroke-width="1.5" class="card-glow" />
    <rect x="515" y="60" width="245" height="30" rx="8" fill="rgba(201, 162, 39, 0.18)" />
    <text x="637" y="81" text-anchor="middle" class="label-main" fill="#c9a227">Bayesian Optimisation</text>
    <text x="637" y="104" text-anchor="middle" class="label-badge" fill="#7c8a9a">Expected Improvement</text>

    <!-- Acquisition Function Curve EI(x) -->
    <g transform="translate(530, 115)">
      <line x1="15" y1="85" x2="200" y2="85" stroke="#7c8a9a" stroke-width="1" />
      <text x="200" y="97" text-anchor="end" class="label-badge" fill="#7c8a9a">Parameter Space</text>
      <text x="12" y="16" class="label-badge" fill="#c9a227">EI</text>

      <!-- EI Acquisition Curve -->
      <path d="M 20 83 Q 70 80 110 20 T 195 83" fill="rgba(201, 162, 39, 0.15)" stroke="#c9a227" stroke-width="2.2" />

      <!-- Moving Sampling Point -->
      <circle cx="110" cy="22" r="5" fill="#c9a227" class="acq-probe" />
    </g>

    <!-- Circular Loop Arrow for Iterative Sampling -->
    <path d="M 705 190 C 725 220, 555 220, 570 190" fill="none" stroke="#c9a227" stroke-width="1.8" stroke-dasharray="3 3" marker-end="url(#arrow-gold)" />
    <text x="637" y="248" text-anchor="middle" class="label-badge" fill="#c9a227">Adaptive Sampling Loop</text>
  </g>

  <!-- Flow 3 -->
  <line x1="760" y1="160" x2="800" y2="160" class="flow-line" marker-end="url(#arrow-clay)" />
  <circle cx="760" cy="160" r="4.5" fill="#d97757" class="pkt-3" />

  <!-- Stage 4: Candidate Electrodes -->
  <g id="box-candidates-output">
    <rect x="800" y="60" width="140" height="215" rx="8" fill="rgba(217, 119, 87, 0.08)" stroke="#d97757" stroke-width="1.5" class="card-glow" />
    <rect x="800" y="60" width="140" height="30" rx="8" fill="rgba(217, 119, 87, 0.18)" />
    <text x="870" y="81" text-anchor="middle" class="label-main" fill="#d97757">Candidate</text>
    <text x="870" y="104" text-anchor="middle" class="label-badge" fill="#d97757">Electrodes</text>

    <!-- Synthesis Recommendations -->
    <g transform="translate(810, 118)">
      <text x="60" y="14" text-anchor="middle" class="label-badge" fill="#d97757">Target C (F/g)</text>
      <text x="60" y="34" text-anchor="middle" class="label-sub">SSA micro ≤ SSA</text>
      <text x="60" y="54" text-anchor="middle" class="label-sub">Pore ≥ 0.3 nm</text>
      <text x="60" y="74" text-anchor="middle" class="label-sub">N, O heteroatoms</text>
    </g>

    <rect x="810" y="232" width="120" height="26" rx="4" fill="rgba(217, 119, 87, 0.15)" stroke="#d97757" stroke-width="1" />
    <text x="870" y="249" text-anchor="middle" class="label-badge" fill="#d97757">Suggested parameters</text>
  </g>
</svg>