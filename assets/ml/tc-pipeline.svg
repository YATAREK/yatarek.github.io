<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" width="100%" height="100%">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#7c8a9a" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#8fae7e" />
    </marker>
    <marker id="arrow-clay" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#d97757" />
    </marker>
  </defs>

  <style>
    .label-main {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 16px;
      font-weight: 600;
      fill: #7c8a9a;
    }
    .label-sub {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 13px;
      font-weight: 500;
      fill: #7c8a9a;
    }
    .label-badge {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 12px;
      font-weight: 600;
    }
    .flow-line {
      stroke: #7c8a9a;
      stroke-width: 2;
      stroke-dasharray: 4 4;
    }

    @keyframes packetMove1 {
      0% { transform: translateX(0px); opacity: 0; }
      20% { opacity: 1; }
      80% { opacity: 1; }
      100% { transform: translateX(40px); opacity: 0; }
    }
    @keyframes packetMove2 {
      0% { transform: translateX(0px); opacity: 0; }
      20% { opacity: 1; }
      80% { opacity: 1; }
      100% { transform: translateX(40px); opacity: 0; }
    }
    @keyframes packetMove3 {
      0% { transform: translateX(0px); opacity: 0; }
      20% { opacity: 1; }
      80% { opacity: 1; }
      100% { transform: translateX(40px); opacity: 0; }
    }
    @keyframes packetMove4 {
      0% { transform: translateX(0px); opacity: 0; }
      20% { opacity: 1; }
      80% { opacity: 1; }
      100% { transform: translateX(40px); opacity: 0; }
    }
    @keyframes packetDrop {
      0% { transform: translateY(0px); opacity: 0; }
      25% { opacity: 1; }
      75% { opacity: 1; }
      100% { transform: translateY(40px); opacity: 0; }
    }
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.9; }
      50% { opacity: 1; stroke-width: 2.2; }
    }

    .pkt-1 { animation: packetMove1 2s cubic-bezier(0.4, 0, 0.2, 1) infinite; }
    .pkt-2 { animation: packetMove2 2s cubic-bezier(0.4, 0, 0.2, 1) infinite 0.5s; }
    .pkt-3 { animation: packetMove3 2s cubic-bezier(0.4, 0, 0.2, 1) infinite 1.0s; }
    .pkt-4 { animation: packetMove4 2s cubic-bezier(0.4, 0, 0.2, 1) infinite 1.5s; }
    .pkt-drop { animation: packetDrop 2s ease-in infinite 1.0s; }
    .card-pulse { animation: pulseGlow 3s ease-in-out infinite; }

    @media (prefers-reduced-motion: reduce) {
      .pkt-1, .pkt-2, .pkt-3, .pkt-4, .pkt-drop, .card-pulse {
        animation: none !important;
      }
    }
  </style>

  <!-- Top Title -->
  <text x="480" y="36" text-anchor="middle" class="label-main" letter-spacing="0.06em">TWO-STAGE HIGH-ENTROPY SUPERCONDUCTOR PREDICTION PIPELINE</text>

  <!-- Stage 1: Alloy Formula -->
  <g id="box-alloy">
    <rect x="24" y="65" width="150" height="150" rx="8" fill="rgba(91, 143, 185, 0.08)" stroke="#5b8fb9" stroke-width="1.5" class="card-pulse" />
    <rect x="24" y="65" width="150" height="32" rx="8" fill="rgba(91, 143, 185, 0.18)" />
    <text x="99" y="86" text-anchor="middle" class="label-main" fill="#5b8fb9">Alloy Formula</text>
    <text x="99" y="118" text-anchor="middle" class="label-main">NbTaTiZrHf</text>
    <text x="99" y="142" text-anchor="middle" class="label-sub">4 to 6 elements</text>
    <text x="99" y="165" text-anchor="middle" class="label-sub">5 to 35 at.% each</text>
    <text x="99" y="195" text-anchor="middle" class="label-badge" fill="#5b8fb9">Composition Input</text>
  </g>

  <!-- Flow 1 -->
  <line x1="174" y1="140" x2="214" y2="140" class="flow-line" marker-end="url(#arrow)" />
  <circle cx="174" cy="140" r="4.5" fill="#5b8fb9" class="pkt-1" />

  <!-- Stage 2: 138 Magpie Descriptors -->
  <g id="box-features">
    <rect x="214" y="65" width="165" height="150" rx="8" fill="rgba(217, 119, 87, 0.08)" stroke="#d97757" stroke-width="1.5" class="card-pulse" />
    <rect x="214" y="65" width="165" height="32" rx="8" fill="rgba(217, 119, 87, 0.18)" />
    <text x="296" y="86" text-anchor="middle" class="label-main" fill="#d97757">138 Descriptors</text>
    <text x="296" y="118" text-anchor="middle" class="label-main">Magpie Features</text>
    <text x="296" y="142" text-anchor="middle" class="label-sub">Melting T range</text>
    <text x="296" y="165" text-anchor="middle" class="label-sub">Space group &amp; VEC</text>
    <text x="296" y="195" text-anchor="middle" class="label-badge" fill="#d97757">Matminer Toolkit</text>
  </g>

  <!-- Flow 2 -->
  <line x1="379" y1="140" x2="419" y2="140" class="flow-line" marker-end="url(#arrow)" />
  <circle cx="379" cy="140" r="4.5" fill="#d97757" class="pkt-2" />

  <!-- Stage 3: Stage 1 Phase Classifier (BCC Gate) -->
  <g id="box-phase">
    <rect x="419" y="65" width="165" height="150" rx="8" fill="rgba(143, 174, 126, 0.08)" stroke="#8fae7e" stroke-width="1.5" class="card-pulse" />
    <rect x="419" y="65" width="165" height="32" rx="8" fill="rgba(143, 174, 126, 0.18)" />
    <text x="501" y="86" text-anchor="middle" class="label-main" fill="#8fae7e">Stage 1: Phase Gate</text>
    <text x="501" y="118" text-anchor="middle" class="label-main">Extra Trees</text>
    <text x="501" y="142" text-anchor="middle" class="label-sub">11,247 HEA samples</text>
    <text x="501" y="165" text-anchor="middle" class="label-sub">96% BCC accuracy</text>
    <text x="501" y="195" text-anchor="middle" class="label-badge" fill="#8fae7e">P(BCC) ≥ 0.70 Gate</text>
  </g>

  <!-- Rejection Path Downward -->
  <line x1="501" y1="215" x2="501" y2="255" class="flow-line" stroke="#d97757" marker-end="url(#arrow-clay)" />
  <circle cx="501" cy="215" r="4" fill="#d97757" class="pkt-drop" />
  <rect x="424" y="258" width="154" height="28" rx="6" fill="rgba(217, 119, 87, 0.12)" stroke="#d97757" stroke-width="1" />
  <text x="501" y="276" text-anchor="middle" class="label-badge" fill="#d97757">P(BCC) &lt; 0.70 Rejected</text>

  <!-- Flow 3 (Pass BCC) -->
  <text x="604" y="130" text-anchor="middle" class="label-badge" fill="#8fae7e">Pass BCC</text>
  <line x1="584" y1="140" x2="624" y2="140" class="flow-line" stroke="#8fae7e" marker-end="url(#arrow-green)" />
  <circle cx="584" cy="140" r="4.5" fill="#8fae7e" class="pkt-3" />

  <!-- Stage 4: Stage 2 Six Regressors -->
  <g id="box-regressors">
    <rect x="624" y="65" width="175" height="150" rx="8" fill="rgba(91, 143, 185, 0.08)" stroke="#5b8fb9" stroke-width="1.5" class="card-pulse" />
    <rect x="624" y="65" width="175" height="32" rx="8" fill="rgba(91, 143, 185, 0.18)" />
    <text x="711" y="86" text-anchor="middle" class="label-main" fill="#5b8fb9">Stage 2: 6 Regressors</text>
    <text x="711" y="118" text-anchor="middle" class="label-main">SuperCon + 66 HEAs</text>
    <text x="711" y="142" text-anchor="middle" class="label-sub">ET (R² 0.87, MAE 0.84 K)</text>
    <text x="711" y="165" text-anchor="middle" class="label-sub">RF, XGB, KNN, SVR, GB</text>
    <text x="711" y="195" text-anchor="middle" class="label-badge" fill="#5b8fb9">Ensemble Consensus</text>
  </g>

  <!-- Flow 4 -->
  <line x1="799" y1="140" x2="839" y2="140" class="flow-line" marker-end="url(#arrow)" />
  <circle cx="799" cy="140" r="4.5" fill="#c9a227" class="pkt-4" />

  <!-- Stage 5: Output Tc -->
  <g id="box-output">
    <rect x="839" y="65" width="105" height="150" rx="8" fill="rgba(201, 162, 39, 0.08)" stroke="#c9a227" stroke-width="1.5" class="card-pulse" />
    <rect x="839" y="65" width="105" height="32" rx="8" fill="rgba(201, 162, 39, 0.18)" />
    <text x="891" y="86" text-anchor="middle" class="label-main" fill="#c9a227">Tc Output</text>
    <text x="891" y="118" text-anchor="middle" class="label-main" fill="#c9a227">Tc ± MAE</text>
    <text x="891" y="142" text-anchor="middle" class="label-sub">6-Model Spread</text>
    <text x="891" y="165" text-anchor="middle" class="label-sub">6.8 K for HEA</text>
    <text x="891" y="195" text-anchor="middle" class="label-badge" fill="#c9a227">Model estimate</text>
  </g>
</svg>