<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <title>Ragone Plot of Energy Density versus Power Density for Energy Storage Devices</title>
  <style>
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
      .fade-fc, .fade-bat, .fade-sc, .fade-cap { opacity: 1 !important; }
      .sc-pulse { transform: none !important; }
    }
    .axis {
      stroke: #7c8a9a;
      stroke-width: 2.5;
      stroke-linecap: round;
    }
    .axis-arrowhead {
      fill: #7c8a9a;
    }
    .ragone-diag {
      stroke: #7c8a9a;
      stroke-width: 1.5;
      stroke-dasharray: 5 5;
      stroke-opacity: 0.35;
    }
    .axis-label {
      font-family: system-ui, sans-serif;
      font-size: 17px;
      font-weight: 600;
      fill: #7c8a9a;
      opacity: 1;
    }
    .blob-label {
      font-family: system-ui, sans-serif;
      font-size: 16px;
      font-weight: 600;
      fill: #7c8a9a;
      opacity: 1;
    }
    .blob-fc {
      fill: #8fae7e;
      fill-opacity: 0.25;
      stroke: #8fae7e;
      stroke-width: 2.8;
      stroke-linejoin: round;
    }
    .blob-bat {
      fill: #5b8fb9;
      fill-opacity: 0.25;
      stroke: #5b8fb9;
      stroke-width: 2.8;
      stroke-linejoin: round;
    }
    .blob-sc {
      fill: #d97757;
      fill-opacity: 0.28;
      stroke: #d97757;
      stroke-width: 3.2;
      stroke-linejoin: round;
    }
    .blob-cap {
      fill: #7c8a9a;
      fill-opacity: 0.22;
      stroke: #7c8a9a;
      stroke-width: 2.8;
      stroke-linejoin: round;
    }

    /* Staggered fade in animation on the translucent blobs */
    .fade-fc { animation: anim-fc 9s ease-in-out infinite; }
    .fade-bat { animation: anim-bat 9s ease-in-out infinite; }
    .fade-sc { animation: anim-sc 9s ease-in-out infinite; }
    .fade-cap { animation: anim-cap 9s ease-in-out infinite; }

    @keyframes anim-fc {
      0% { opacity: 0.2; }
      14%, 86% { opacity: 1; }
      96%, 100% { opacity: 0.2; }
    }
    @keyframes anim-bat {
      0%, 14% { opacity: 0.2; }
      28%, 86% { opacity: 1; }
      96%, 100% { opacity: 0.2; }
    }
    @keyframes anim-sc {
      0%, 28% { opacity: 0.2; }
      42%, 86% { opacity: 1; }
      96%, 100% { opacity: 0.2; }
    }
    @keyframes anim-cap {
      0%, 42% { opacity: 0.2; }
      56%, 86% { opacity: 1; }
      96%, 100% { opacity: 0.2; }
    }

    /* Subtle pulse on supercapacitors blob */
    .sc-pulse {
      transform-origin: 390px 210px;
      animation: pulse-supercap 3s ease-in-out infinite;
    }
    @keyframes pulse-supercap {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.035); }
    }
  </style>

  <!-- Diagonal discharge time reference lines -->
  <line x1="120" y1="65" x2="550" y2="280" class="ragone-diag" />
  <line x1="110" y1="135" x2="455" y2="305" class="ragone-diag" />
  <line x1="230" y1="55" x2="575" y2="225" class="ragone-diag" />

  <!-- Ragone Axes -->
  <!-- Horizontal power density axis -->
  <line x1="95" y1="305" x2="570" y2="305" class="axis" />
  <polygon points="580,305 566,299 566,311" class="axis-arrowhead" />
  <text x="510" y="336" text-anchor="end" class="axis-label">power density</text>

  <!-- Vertical energy density axis -->
  <line x1="95" y1="305" x2="95" y2="45" class="axis" />
  <polygon points="95,35 89,49 101,49" class="axis-arrowhead" />
  <text x="110" y="42" text-anchor="start" class="axis-label">energy density</text>

  <!-- 1. Fuel Cells Blob (Sage, top-left) -->
  <path class="blob-fc fade-fc" d="M 135 75 C 135 60, 160 55, 190 60 C 220 65, 235 85, 225 115 C 215 140, 185 145, 155 135 C 135 125, 135 95, 135 75 Z" />

  <!-- 2. Batteries Blob (Blue, upper-center) -->
  <path class="blob-bat fade-bat" d="M 215 125 C 220 105, 255 100, 290 110 C 325 120, 340 145, 330 170 C 320 195, 280 205, 245 195 C 220 185, 210 150, 215 125 Z" />

  <!-- 3. Supercapacitors Blob (Clay, middle, gently pulsing) -->
  <g class="fade-sc">
    <path class="blob-sc sc-pulse" d="M 320 180 C 330 155, 375 150, 420 165 C 460 180, 475 210, 460 238 C 440 265, 395 270, 355 255 C 325 240, 315 205, 320 180 Z" />
  </g>

  <!-- 4. Capacitors Blob (Steel, bottom-right) -->
  <path class="blob-cap fade-cap" d="M 450 245 C 455 230, 485 225, 520 235 C 550 245, 560 265, 550 282 C 540 298, 510 302, 480 295 C 455 288, 445 265, 450 245 Z" />

  <!-- Fully Opaque Labels (rendered statically on top, do not fade with blobs) -->
  <text x="180" y="103" text-anchor="middle" class="blob-label">fuel cells</text>
  <text x="272" y="158" text-anchor="middle" class="blob-label">batteries</text>
  <text x="390" y="218" text-anchor="middle" class="blob-label">supercapacitors</text>
  <text x="500" y="268" text-anchor="middle" class="blob-label">capacitors</text>
</svg>
